name: Ansible Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Install required Ansible collection
        run: |
          ansible-galaxy collection install community.docker

      - name: Validate main playbook
        working-directory: ansible
        env:
          ZABBIX_DB_PASSWORD: ci-placeholder-password
        run: |
          ansible-playbook -i inventory.example.ini site.yml --syntax-check

      - name: Validate release deployment playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.example.ini deploy-release.yml --syntax-check
