---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common administration packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Ensure operations group exists
  ansible.builtin.group:
    name: operations
    state: present

- name: Add devops user to operations group
  ansible.builtin.user:
    name: devops
    groups: operations
    append: true

- name: Create lab operations directory
  ansible.builtin.file:
    path: /opt/devops-lab
    state: directory
    owner: devops
    group: operations
    mode: "0755"

- name: Create environment identification file
  ansible.builtin.copy:
    dest: /etc/devops-lab.conf
    content: |
      managed_by=ansible
      project=linux-devops-operations-lab
      environment=lab
    owner: root
    group: root
    mode: "0644"
