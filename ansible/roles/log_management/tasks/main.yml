---
- name: Install logrotate
  ansible.builtin.apt:
    name: logrotate
    state: present
    update_cache: true

- name: Ensure application log directory exists
  ansible.builtin.file:
    path: /var/log/devops-demo
    state: directory
    owner: root
    group: adm
    mode: "0755"

- name: Deploy application log rotation policy
  ansible.builtin.template:
    src: devops-demo.j2
    dest: /etc/logrotate.d/devops-demo
    owner: root
    group: root
    mode: "0644"
