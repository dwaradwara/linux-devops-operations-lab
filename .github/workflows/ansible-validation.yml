name: Ansible Validation

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible pyyaml

      - name: Install required Ansible collection
        run: |
          ansible-galaxy collection install community.docker

      - name: Validate main playbook
        working-directory: ansible
        env:
          ZABBIX_DB_PASSWORD: ci-placeholder-password
          SNMP_COMMUNITY: ci-placeholder-community
        run: |
          ansible-playbook -i inventory.example.ini site.yml --syntax-check

      - name: Validate release deployment playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.example.ini deploy-release.yml --syntax-check

      - name: Validate Zabbix template YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path("monitoring/zabbix/templates").glob("*.yaml"))
          if not paths:
              raise SystemExit("No Zabbix templates found")

          for path in paths:
              data = yaml.safe_load(path.read_text())
              export = data.get("zabbix_export", {})
              if export.get("version") != "7.0":
                  raise SystemExit(f"{path}: expected Zabbix export version 7.0")
              if not export.get("templates"):
                  raise SystemExit(f"{path}: no templates defined")
              print(f"validated {path}")
          PY
